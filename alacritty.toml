[font]
size = 8

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
opacity = 0.75
decorations = "Full"
dynamic_padding = false

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "wsl.exe"
args = []

[scrolling]
history = 10000
multiplier = 3

[terminal]
osc52 = "Disabled"

[selection]
save_to_clipboard = false

[mouse]
hide_when_typing = false
# No bindings defined - all mouse events pass through to tmux
# Hold Shift to select text in Alacritty instead of sending to tmux

